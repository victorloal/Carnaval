name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    # SEC-46 / NFR-09: Django settings fail loudly when a required secret is
    # absent, so CI provides an explicit, non-production test value here —
    # rather than a default ever living in the code. It is deliberately long:
    # `check --deploy` warns on a short or low-entropy key (W009).
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789-abcdef-XYZ

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Vitest 5 requires Node >= 22.12; Vite and eslint agree at 24.
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # NFR-10: a known vulnerability in a pinned dependency fails the build,
      # rather than waiting for the next Dependabot PR to be noticed.
      - name: Audit dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Stage 1 — lint, and the SEC-46 secret scan with it.
      - name: Lint with ruff
        run: |
          ruff check backend
          ruff format --check backend

      - name: Scan tracked files for secrets
        run: python scripts/check_secrets.py

      # Stage 2 — typecheck the backend.
      - name: Type check with mypy
        run: mypy backend
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings

      # Stages 3–5 — frontend typecheck, lint and unit tests.
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

      # Stage 6 — migration drift.
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings

      # NFR-07 / SEC-15: production transport security must be in place with
      # DEBUG off, the way the deployment runs.
      - name: Deployment checks
        run: python manage.py check --deploy
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings
          DEBUG: "0"

      # Stages 7–8 — the API contract, validated then drift-checked.
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings

      - name: Check OpenAPI drift
        run: |
          python manage.py spectacular --file ../docs/02-diseno/openapi.yaml
          cd ..
          git diff --exit-code docs/02-diseno/openapi.yaml
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings

      # Stage 9 — backend tests, with the NFR-15 coverage gate.
      - name: Run backend tests
        run: |
          python -m pytest \
            --cov=carnaval.ingestion --cov=carnaval.api \
            --cov-fail-under=80 --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings

      # Stage 10 — the frontend production build.
      - name: Frontend build
        run: npm run build
        working-directory: frontend

      # The docs check runs with stage 1; it gates documentation, not the build.
      - name: Check diagrams
        run: node scripts/check-diagrams.cjs .

      # Still not wired: stages 12–14 (docker compose + Playwright E2E,
      # Lighthouse, axe). They need a browser environment; they are carried in
      # docs/sprints/sprint-07-plan.md and the retrospective, not silently
      # skipped. The dependency audit now runs in this job, and the PostgreSQL
      # service below runs the suite against the deployment database.

  # The suite runs on SQLite in `ci` (fast, zero infrastructure) and on
  # PostgreSQL 16 here, so the Postgres-only branch of search (FR-I-03) is
  # exercised and the deployment database is the one the tests prove.
  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carnaval
          POSTGRES_USER: carnaval
          POSTGRES_PASSWORD: carnaval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carnaval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-0123456789-abcdef-XYZ
      DB_NAME: carnaval
      DB_USER: carnaval
      DB_PASSWORD: carnaval
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests on PostgreSQL
        run: python -m pytest -q
        env:
          DJANGO_SETTINGS_MODULE: carnaval.settings
