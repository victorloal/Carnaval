openapi: 3.0.3
info:
  title: Carnaval de Pasto API
  version: 1.0.0
  description: API for Carnaval de Pasto project
paths:
  /api/days/:
    get:
      operationId: api_days_list
      parameters:
      - in: query
        name: edition
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDayList'
          description: ''
  /api/days/{id}/:
    get:
      operationId: api_days_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this day.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
          description: ''
  /api/editions/:
    get:
      operationId: api_editions_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEditionList'
          description: ''
  /api/editions/{id}/:
    get:
      operationId: api_editions_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this edition.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Edition'
          description: ''
  /api/events/:
    get:
      operationId: api_events_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: edition
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/events/{id}/:
    get:
      operationId: api_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this event.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/media/:
    get:
      operationId: api_media_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaAssetList'
          description: ''
  /api/media/{id}/:
    get:
      operationId: api_media_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this media asset.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
          description: ''
  /api/news/:
    get:
      operationId: api_news_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewsItemList'
          description: ''
  /api/news/{id}/:
    get:
      operationId: api_news_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this news item.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'
          description: ''
  /api/search/:
    get:
      operationId: api_search_retrieve
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
  /api/submissions/:
    post:
      operationId: api_submissions_create
      tags:
      - api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionSubmit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmissionSubmit'
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionSubmit'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
          description: ''
  /api/submissions/{token}/:
    get:
      operationId: api_submissions_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
          description: ''
  /api/venues/:
    get:
      operationId: api_venues_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVenueList'
          description: ''
  /api/venues/{id}/:
    get:
      operationId: api_venues_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this venue.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
          description: ''
  /takedown/:
    post:
      operationId: takedown_create
      tags:
      - takedown
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TakedownRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakedownResponse'
          description: ''
components:
  schemas:
    ClaimTypeEnum:
      enum:
      - copyright
      - privacy
      - illegal_content
      - other
      type: string
      description: |-
        * `copyright` - Copyright
        * `privacy` - Privacy
        * `illegal_content` - Illegal content
        * `other` - Other
    Day:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        edition:
          type: string
          format: uuid
        date:
          type: string
          format: date
        slug_es:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        slug_en:
          oneOf:
          - type: string
            default: ''
            maxLength: 200
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        label_es:
          type: string
          maxLength: 200
        label_en:
          type: string
          maxLength: 200
      required:
      - date
      - edition
      - id
      - label_es
      - slug_es
    Edition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        year:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        slug_es:
          type: string
          maxLength: 200
          pattern: ^[-a-zA-Z0-9_]+$
        slug_en:
          oneOf:
          - type: string
            maxLength: 200
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        title_es:
          type: string
          maxLength: 200
        title_en:
          type: string
          maxLength: 200
        starts_on:
          type: string
          format: date
          nullable: true
        ends_on:
          type: string
          format: date
          nullable: true
        summary_es:
          type: string
        summary_en:
          type: string
      required:
      - id
      - slug_es
      - title_es
      - year
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day:
          type: string
          format: uuid
        venue:
          type: string
          format: uuid
          nullable: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        title_es:
          type: string
          maxLength: 200
        title_en:
          type: string
          maxLength: 200
        description_es:
          type: string
        description_en:
          type: string
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        source_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
      required:
      - day
      - id
      - title_es
    KindEnum:
      enum:
      - image
      - video_link
      type: string
      description: |-
        * `image` - Image
        * `video_link` - Video link
    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        edition:
          type: string
          format: uuid
          nullable: true
        title_es:
          type: string
          maxLength: 300
        title_en:
          type: string
          maxLength: 300
        description_es:
          type: string
        description_en:
          type: string
        year_approx:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        author:
          type: string
          maxLength: 300
        source_ref:
          type: string
          maxLength: 300
        license:
          type: string
          maxLength: 200
        citation_text:
          type: string
        featured:
          type: boolean
      required:
      - id
      - title_es
    NewsItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        headline:
          type: string
          maxLength: 300
        url:
          type: string
          format: uri
          maxLength: 2000
        outlet:
          type: string
          maxLength: 200
        published_on:
          type: string
          format: date
          nullable: true
        summary_es:
          type: string
        summary_en:
          type: string
      required:
      - headline
      - id
      - url
    PaginatedDayList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Day'
    PaginatedEditionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Edition'
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    PaginatedMediaAssetList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
    PaginatedNewsItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
    PaginatedVenueList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
    SearchEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title_es:
          type: string
        title_en:
          type: string
      required:
      - id
      - title_en
      - title_es
    SearchNews:
      type: object
      properties:
        id:
          type: string
          format: uuid
        headline:
          type: string
      required:
      - headline
      - id
    SearchResponse:
      type: object
      properties:
        query:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/SearchEvent'
        news:
          type: array
          items:
            $ref: '#/components/schemas/SearchNews'
      required:
      - events
      - news
      - query
    SubmissionCreated:
      type: object
      properties:
        token:
          type: string
        status:
          type: string
      required:
      - status
      - token
    SubmissionStatus:
      type: object
      properties:
        status:
          type: string
        rejection_reason:
          type: string
      required:
      - rejection_reason
      - status
    SubmissionSubmit:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        rights:
          type: boolean
        video_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        author:
          type: string
        year:
          type: integer
          nullable: true
        place:
          type: string
        description:
          type: string
        minor_subject:
          type: boolean
        captcha:
          type: string
        website:
          type: string
        file:
          type: string
          format: uri
          nullable: true
      required:
      - kind
      - rights
    TakedownRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        claim_type:
          $ref: '#/components/schemas/ClaimTypeEnum'
        name:
          type: string
        evidence_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        subject_type:
          type: string
      required:
      - claim_type
      - email
    TakedownResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_es:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        address:
          type: string
        city:
          type: string
          maxLength: 200
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
      required:
      - id
      - name_es
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
