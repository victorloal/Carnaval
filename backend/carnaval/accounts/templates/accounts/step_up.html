{% load i18n %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reautenticación</title>
  </head>
  <body>
    <main>
      <h1>Reautenticación</h1>
      <p>Introduce tu contraseña y un código de tu aplicación de autenticación.</p>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}" />
        <p>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </p>
        <p>
          <label for="token">Código TOTP</label>
          <input id="token" name="token" inputmode="numeric" autocomplete="one-time-code" required />
        </p>
        <button type="submit">Confirmar</button>
      </form>
    </main>
  </body>
</html>
