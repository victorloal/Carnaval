[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ", "T20"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "backend"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "carnaval.settings"

# Vetted third-party libraries that ship no py.typed marker (django-otp 1.5.4,
# factory-boy 3.3.1): mypy cannot see inside them, so only their *imports* are
# skipped. Every module of ours that uses them stays fully checked.
[[tool.mypy.overrides]]
module = ["factory", "django_otp.*"]
ignore_missing_imports = true
